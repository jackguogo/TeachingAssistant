<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI课程助手 - 双脑与心理健康</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  
  <style>
    /* 隐藏滚动条以保证界面的高级感，但保留滚动功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { background-color: #e5e7eb; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    /* 图标对齐样式 */
    .material-symbols-outlined { font-size: inherit; vertical-align: bottom; }
  </style>
</head>
<body class="selection:bg-indigo-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { createRoot } = ReactDOM;

    // 通用图标组件
    const Icon = ({ name, className }) => (
      <span className={`material-symbols-outlined ${className || ''}`}>{name}</span>
    );

    const StudentApp = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [emotion, setEmotion] = useState(null);

      // --- 1. 首页视图 ---
      const HomeView = () => (
        <div className="flex-1 overflow-y-auto bg-[#f4f4f5] pb-28 h-full no-scrollbar relative">
          <div className="relative bg-gradient-to-br from-indigo-500 via-purple-500 to-violet-600 rounded-b-[2.5rem] pt-16 pb-20 px-6 text-white shadow-lg overflow-hidden">
            <div className="absolute top-0 right-0 w-64 h-64 bg-white opacity-10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
            <div className="absolute bottom-0 left-0 w-40 h-40 bg-indigo-300 opacity-20 rounded-full blur-2xl translate-y-1/2 -translate-x-1/4"></div>
            
            <div className="relative flex items-center gap-4 z-10">
              <div className="shrink-0 relative">
                <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=150&q=80" alt="头像" className="w-16 h-16 rounded-[1.25rem] object-cover border-2 border-white/30 shadow-[0_8px_16px_rgb(0,0,0,0.15)]" />
                <div className="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-400 border-2 border-indigo-500 rounded-full"></div>
              </div>
              <div className="flex-1">
                <h2 className="text-[22px] font-extrabold tracking-tight text-white mb-1.5 drop-shadow-sm">张子涵</h2>
                <div className="inline-flex items-center gap-1.5 bg-black/15 backdrop-blur-md px-3 py-1 rounded-full border border-white/20 shadow-sm">
                  <Icon name="menu_book" className="w-3.5 h-3.5 text-indigo-100" />
                  <span className="text-indigo-50 text-[10px] font-bold tracking-wide">《双脑与心理健康》秋季班</span>
                </div>
              </div>
            </div>
          </div>

          <div className="px-5 -mt-12 relative z-20 space-y-5">
            {/* 情绪打卡卡片 */}
            <div className="bg-white/80 backdrop-blur-xl rounded-3xl p-5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white relative overflow-hidden transition-all duration-300">
              <div className="absolute top-0 right-0 w-24 h-24 bg-gradient-to-bl from-indigo-50 to-transparent rounded-bl-full -z-10 opacity-60"></div>
              
              <div className="flex justify-between items-center mb-3.5">
                <p className="font-bold text-slate-800 flex items-center gap-2 text-sm">
                  <span className="w-2 h-4 bg-indigo-500 rounded-full inline-block"></span>今日情绪打卡
                </p>
                {emotion && (
                  <button onClick={() => setEmotion(null)} className="flex items-center gap-1 text-[10px] text-indigo-600 font-bold bg-indigo-50 px-2.5 py-1 rounded-full hover:bg-indigo-100 active:scale-95 transition-all shadow-sm border border-indigo-100/50">
                    <Icon name="sync" className="w-3 h-3" />切换心情
                  </button>
                )}
              </div>

              <div className="flex justify-between gap-2">
                {['🤩 狂喜', '😄 开心', '😌 平静', '😔 低落', '😢 悲伤'].map((emo) => {
                  const isSelected = emotion === emo;
                  const isOtherSelected = emotion !== null && !isSelected;
                  return (
                    <button 
                      key={emo} 
                      onClick={() => setEmotion(emo)} 
                      disabled={isOtherSelected}
                      className={`flex-1 py-2.5 px-1 rounded-2xl text-[10px] sm:text-xs font-medium text-center border shadow-sm transition-all duration-300 whitespace-nowrap
                        ${!emotion ? 'bg-white text-slate-600 border-slate-100 hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-600 active:scale-95' 
                          : isSelected ? 'bg-gradient-to-br from-indigo-500 to-purple-500 text-white border-transparent shadow-md shadow-indigo-500/30 scale-105 ring-2 ring-indigo-100 ring-offset-1' 
                          : 'bg-slate-50 text-slate-400 border-slate-100 opacity-40 grayscale pointer-events-none'}`}
                    >{emo}</button>
                  )
                })}
              </div>
            </div>

            <div className="flex items-center justify-center pt-2 pb-1">
              <div className="h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent flex-1"></div>
              <span className="px-4 text-[10px] text-slate-400 font-bold tracking-widest uppercase">学习模块</span>
              <div className="h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent flex-1"></div>
            </div>

            <div className="bg-white rounded-2xl p-5 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-100">
              <div className="flex justify-between items-center mb-3">
                <h3 className="font-bold text-slate-800 flex items-center gap-2 text-sm"><Icon name="bolt" className="w-4 h-4 text-amber-500" />学习进度</h3>
                <div className="bg-indigo-50 text-indigo-600 font-bold text-xs px-2.5 py-1 rounded-full">45%</div>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-3 mb-2.5 shadow-inner overflow-hidden relative">
                <div className="absolute top-0 left-0 bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full w-[45%]"></div>
              </div>
              <p className="text-[11px] text-slate-500 font-medium">当前：第三章 情绪与神经递质</p>
            </div>

            <div>
              <div className="flex justify-between items-end mb-3 px-1">
                <h3 className="font-bold text-slate-800 flex items-center gap-2 text-sm"><Icon name="show_chart" className="w-4 h-4 text-rose-500" />近期任务</h3>
                <span className="text-[10px] text-slate-400 font-medium">2项待办</span>
              </div>
              <div className="space-y-3">
                <div className="bg-white rounded-2xl p-4 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-rose-100/50 relative overflow-hidden group">
                  <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-rose-500"></div>
                  <div className="flex justify-between items-center pl-2">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="bg-rose-100 text-rose-600 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">问卷</span>
                        <span className="text-rose-500 text-[10px] flex items-center gap-0.5 font-medium"><Icon name="schedule" className="w-3 h-3" /> 今晚 23:59 截止</span>
                      </div>
                      <p className="font-bold text-slate-800 text-sm">SCL-90 心理健康测评</p>
                    </div>
                    <button className="bg-gradient-to-r from-rose-500 to-pink-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-lg shadow-rose-500/30 active:scale-95 transition-all flex items-center gap-0.5">
                      去完成 <Icon name="chevron_right" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-4 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-indigo-100/50 relative overflow-hidden">
                  <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-indigo-500"></div>
                  <div className="flex justify-between items-center pl-2">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="bg-indigo-100 text-indigo-600 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">作业</span>
                        <span className="text-slate-400 text-[10px] flex items-center gap-0.5 font-medium"><Icon name="schedule" className="w-3 h-3" /> 剩余 2 天</span>
                      </div>
                      <p className="font-bold text-slate-800 text-sm">多巴胺机制简答</p>
                    </div>
                    <button className="bg-gradient-to-r from-indigo-500 to-violet-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-lg shadow-indigo-500/30 active:scale-95 transition-all flex items-center gap-0.5">
                      去完成 <Icon name="chevron_right" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>
                
                <div className="bg-white rounded-2xl p-4 shadow-[0_4px_20px_rgb(0,0,0,0.02)] border border-slate-100 relative overflow-hidden opacity-80">
                  <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-emerald-400"></div>
                  <div className="flex justify-between items-center pl-2">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="bg-slate-100 text-slate-500 text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">测试</span>
                        <span className="text-slate-400 text-[10px] flex items-center gap-0.5 font-medium">10月12日 提交</span>
                      </div>
                      <p className="font-bold text-slate-500 text-sm line-through decoration-slate-300">单元测试一：大脑基础</p>
                    </div>
                    <div className="flex items-center justify-center w-9 h-9 rounded-full bg-emerald-50 border border-emerald-100">
                      <Icon name="check_circle" className="w-5 h-5 text-emerald-500" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );

      // --- 2. AI 聊天视图 ---
      const AIView = () => {
        const qaDatabase = [
          { short: "多巴胺与内啡肽", q: "多巴胺与内啡肽的区别是什么？", a: "多巴胺主要负责“期待奖赏”的兴奋感和动力，促使我们去行动；而内啡肽通常在完成挑战或高强度运动后释放，带来平静、深层的愉悦感和镇痛效果。\n\n💡 来源：《课程讲义 02》P15" },
          { short: "压力与易怒", q: "为什么面对压力时我总是容易发脾气？", a: "压力会刺激“情绪脑”（边缘系统）中的杏仁核过度活跃，同时会抑制“理智脑”（前额叶皮层）的调节功能，导致我们更难控制冲动和情绪反应。\n\n💡 来源：《课程讲义 04》P08" },
          { short: "正念冥想", q: "正念冥想是如何改变大脑结构的？", a: "研究表明，长期的正念冥想可以增加前额叶皮层的厚度（增强情绪控制力），并缩小杏仁核的体积（降低对压力的敏感度），从而从物理结构上提升心理韧性。\n\n💡 来源：《课程讲义 05》P22" },
          { short: "倒U型模型", q: "什么是“倒U型压力模型”？", a: "倒U型假说指出，适度的压力能提高唤醒水平，使表现达到最佳；但当压力过大且持续时，大脑会进入过度防御状态，导致表现急剧下降。\n\n💡 来源：《拓展阅读：压力管理》" },
          { short: "睡前胡思乱想", q: "晚上总是熬夜胡思乱想怎么缓解？", a: "睡前反刍通常是大脑的“默认模式网络(DMN)”过度活跃。建议睡前一小时远离屏幕，尝试“正念呼吸法”或写下“烦恼清单”将思维外包。\n\n💡 来源：《课程讲义 06》P11" }
        ];

        const [messages, setMessages] = useState([
          { role: 'ai', text: '你好！我是基于《双脑与心理健康》教材构建的AI助教。有关课程知识点、作业疑惑，都可以向我提问哦。' },
          { role: 'user', text: '老师提到的“情绪预警信号”具体指什么？' },
          { role: 'ai', text: '情绪预警信号是指在情绪失控前，身体和注意力先出现的一组变化，比如呼吸变浅、肩颈紧绷、反复想同一件事。\n\n💡 来源：《课程讲义 03》P12 · “觉察先于调节”' }
        ]);
        const [input, setInput] = useState('');
        const messagesEndRef = useRef(null);

        useEffect(() => messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }), [messages]);

        const handleSend = (quickText) => {
          const textToProcess = typeof quickText === 'string' ? quickText : input;
          const finalQ = textToProcess.trim() || qaDatabase[0].q;
          
          setMessages(prev => [...prev, { role: 'user', text: finalQ }]);
          setInput('');

          const matchedQA = qaDatabase.find(qa => qa.q.includes(finalQ) || finalQ.includes(qa.q.substring(0, 5)));
          const answerText = matchedQA ? matchedQA.a : "根据学术边界设定，该问题未在当前教材范围内找到明确出处。建议您在下节课直接向教授提问哦。";

          setTimeout(() => setMessages(prev => [...prev, { role: 'ai', text: answerText }]), 800);
        };

        return (
          <div className="flex flex-col h-full bg-[#f8fafc] pb-32 relative">
            <div className="bg-white/80 backdrop-blur-xl pt-14 pb-3 px-5 shadow-sm sticky top-0 z-20 border-b border-slate-100 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-md shadow-indigo-500/20"><Icon name="auto_awesome" className="w-5 h-5 text-white" /></div>
                <div>
                  <h2 className="font-extrabold text-slate-800 text-base">AI 课程助教</h2>
                  <p className="text-[10px] text-emerald-600 font-medium flex items-center gap-1.5 bg-emerald-50 px-2 py-0.5 rounded-full mt-0.5 inline-flex"><span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>教材范围 RAG 已连接</p>
                </div>
              </div>
              <button className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><Icon name="more_horiz" className="w-5 h-5" /></button>
            </div>

            <div className="flex-1 overflow-y-auto p-5 space-y-5 no-scrollbar">
              <div className="flex justify-center"><span className="text-[10px] font-medium bg-slate-100 text-slate-400 px-3 py-1.5 rounded-full border border-slate-200/50">已开启学术边界模式，仅回答课程相关问题</span></div>
              {messages.map((msg, idx) => (
                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} group`}>
                  {msg.role === 'ai' && <div className="w-8 h-8 rounded-full bg-indigo-100 border border-indigo-200 flex items-center justify-center mr-2 shrink-0 self-end mb-1"><Icon name="auto_awesome" className="w-4 h-4 text-indigo-600" /></div>}
                  <div className={`max-w-[75%] whitespace-pre-wrap rounded-3xl p-3.5 text-[13px] leading-relaxed shadow-sm ${msg.role === 'user' ? 'bg-gradient-to-br from-indigo-600 to-purple-600 text-white rounded-br-sm shadow-indigo-500/20' : 'bg-white border border-slate-100 text-slate-700 rounded-bl-sm shadow-[0_4px_15px_rgb(0,0,0,0.02)]'}`}>{msg.text}</div>
                </div>
              ))}
              <div ref={messagesEndRef} />
            </div>

            <div className="absolute bottom-20 left-0 w-full px-4 z-20">
              <div className="flex gap-2 overflow-x-auto no-scrollbar mb-2.5 px-1">
                {qaDatabase.map((qa, idx) => (
                  <button key={idx} onClick={() => handleSend(qa.q)} className="shrink-0 bg-white/80 backdrop-blur-md border border-indigo-100/60 text-indigo-600 text-[11px] font-bold px-3.5 py-1.5 rounded-full shadow-sm hover:bg-indigo-50 active:scale-95 transition-all">{qa.short}</button>
                ))}
              </div>
              <div className="bg-white/90 backdrop-blur-xl p-1.5 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-white flex items-center gap-2">
                <input type="text" value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} placeholder={`提问：${qaDatabase[0].q}`} className="flex-1 bg-transparent py-2.5 px-4 text-sm focus:outline-none text-slate-700 placeholder:text-slate-400" />
                <button onClick={handleSend} className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white shrink-0 shadow-md shadow-indigo-600/30 hover:bg-indigo-700 active:scale-90 transition-all"><Icon name="send" className="w-4 h-4 ml-0.5" /></button>
              </div>
            </div>
          </div>
        );
      };

      // --- 3. 笔记本视图 ---
      const NotebookView = () => {
        const [subTab, setSubTab] = useState('errors');
        return (
          <div className="flex-1 overflow-y-auto bg-[#f8fafc] pb-24 flex flex-col h-full no-scrollbar">
            <div className="bg-white/80 backdrop-blur-xl pt-14 pb-4 px-5 shadow-sm sticky top-0 z-10 shrink-0 border-b border-slate-100">
              <h2 className="text-xl font-extrabold text-slate-800 mb-4">学习笔记本</h2>
              <div className="bg-slate-100/80 p-1 rounded-2xl flex">
                {[{ id: 'errors', label: '自动错题集' }, { id: 'graph', label: '知识图谱' }, { id: 'mindmap', label: '思维脑图' }].map(tab => (
                  <button key={tab.id} onClick={() => setSubTab(tab.id)} className={`flex-1 py-1.5 text-xs font-bold rounded-xl transition-all duration-300 ${subTab === tab.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>{tab.label}</button>
                ))}
              </div>
            </div>

            <div className="p-5 flex-1 overflow-y-auto no-scrollbar">
              {subTab === 'errors' && (
                <div className="space-y-4 animate-in slide-in-from-left-4 fade-in duration-300">
                  <div className="bg-amber-50 border border-amber-200/50 rounded-2xl p-3.5 flex gap-3 text-xs text-amber-800 shadow-sm">
                    <Icon name="error" className="w-4 h-4 shrink-0 text-amber-500 mt-0.5" />
                    <span className="leading-relaxed">系统根据“单元测试一”自动记录了2道错题，建议及时通过AI检索学习。</span>
                  </div>
                  {[{ id: 1, type: '单选题', tag: '神经递质', q: '主管情绪调节的大脑区域主要包含以下哪个？', myAns: '海马体', correctAns: '杏仁核' }, { id: 2, type: '判断题', tag: '压力机制', q: '所有的压力都会对大脑造成不可逆的器质性损伤。', myAns: '正确', correctAns: '错误' }].map(item => (
                    <div key={item.id} className="bg-white rounded-3xl p-5 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border border-slate-100">
                      <div className="flex justify-between items-center mb-3">
                        <div className="flex gap-2">
                          <span className="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-md font-bold">{item.type}</span><span className="bg-indigo-50 text-indigo-600 text-[10px] px-2 py-0.5 rounded-md font-bold">{item.tag}</span>
                        </div>
                        <span className="text-[10px] text-slate-400 font-medium tracking-wide">10-12 记录</span>
                      </div>
                      <p className="text-[13px] font-bold text-slate-800 mb-4 leading-relaxed">{item.q}</p>
                      <div className="space-y-2 mb-4">
                        <div className="bg-rose-50/50 border border-rose-100 p-2.5 rounded-xl text-xs flex items-center justify-between"><span className="text-slate-500 font-medium">你的答案</span><span className="text-rose-500 font-bold line-through">{item.myAns}</span></div>
                        <div className="bg-emerald-50/50 border border-emerald-100 p-2.5 rounded-xl text-xs flex items-center justify-between"><span className="text-slate-500 font-medium">正确答案</span><span className="text-emerald-600 font-bold">{item.correctAns}</span></div>
                      </div>
                      <div className="flex justify-end pt-3 border-t border-slate-50"><button onClick={() => setActiveTab('ai')} className="flex items-center gap-1.5 text-xs text-white font-bold bg-slate-900 px-4 py-2 rounded-xl hover:bg-slate-800 active:scale-95 transition-all shadow-md shadow-slate-900/10"><Icon name="auto_awesome" className="w-3.5 h-3.5 text-amber-400" />让 AI 讲解此题</button></div>
                    </div>
                  ))}
                </div>
              )}

              {subTab === 'graph' && (
                <div className="space-y-4 h-full flex flex-col">
                  <div className="relative flex-1 bg-slate-900 rounded-3xl overflow-hidden shadow-xl border border-slate-800 min-h-[400px]">
                    <div className="absolute inset-0 opacity-20" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '24px 24px' }}></div>
                    <svg className="absolute inset-0 w-full h-full">
                      <line x1="50%" y1="50%" x2="30%" y2="30%" stroke="#6366f1" strokeWidth="2" strokeDasharray="4" opacity="0.6" className="animate-pulse"/><text x="38%" y="42%" fill="#a5b4fc" fontSize="9" fontWeight="bold">包含</text>
                      <line x1="50%" y1="50%" x2="70%" y2="70%" stroke="#6366f1" strokeWidth="2" opacity="0.6"/><text x="62%" y="58%" fill="#a5b4fc" fontSize="9" fontWeight="bold">调节</text>
