    const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return { x: centerX + (radius * Math.cos(angleInRadians)), y: centerY + (radius * Math.sin(angleInRadians)) };
    };

    const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
      const startOuter = polarToCartesian(x, y, outerRadius, endAngle);
      const endOuter = polarToCartesian(x, y, outerRadius, startAngle);
      const startInner = polarToCartesian(x, y, innerRadius, endAngle);
      const endInner = polarToCartesian(x, y, innerRadius, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return ["M", startOuter.x, startOuter.y, "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOuter.x, endOuter.y, "L", endInner.x, endInner.y, "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startInner.x, startInner.y, "Z"].join(" ");
    };

    function useSmoothRotation(target) {
      const currentRef = useRef(target);
      const [, setTick] = useState(0);
      useEffect(() => {
        let raf;
        const loop = () => {
          let diff = (target - currentRef.current) % 360;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          if (Math.abs(diff) < 0.1) { currentRef.current = target; setTick(t => t + 1); return; }
          currentRef.current += diff * 0.12; 
          setTick(t => t + 1);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, [target]);
      return currentRef.current;
    }

    const getIntensityFullLabel = (val) => {
      if (val === 0) return '整体平静没有特殊';
      if (val <= 2) return '正常';
      if (val === 3) return '临界';
      return '强烈';
    };
    
    const getIntensityShortLabel = (val) => {

    };

    const generateMockEmotion = (year, month, day) => {
       const today = new Date(); today.setHours(0,0,0,0);
       const checkDate = new Date(year, month, day);
       if (checkDate > today) return null; 
       const seed = year * 10000 + (month+1) * 100 + day;
       const random = Math.abs(Math.sin(seed));
       if (random > 0.4) return null; 
       const emojis = ['😊', '😌', '😢', '😡', '😨', '🤢', '🤩'];
       const labels = ['快乐', '平静', '悲伤', '愤怒', '恐惧', '厌恶', '兴奋'];
       const index = Math.floor((random * 10) % emojis.length);
       return { emo: emojis[index], label: labels[index] };
    };

    const SignaturePad = ({ onSign, onClear }) => {
        const canvasRef = useRef(null);
        const [isDrawing, setIsDrawing] = useState(false);

        useEffect(() => {
            const canvas = canvasRef.current;
            if(canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d');
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
            }
        }, []);

        const start = (e) => {
            setIsDrawing(true);
            draw(e, true);
        };
        const end = () => setIsDrawing(false);
        const draw = (e, isStart = false) => {
            if (!isDrawing && !isStart) return;
            e.preventDefault(); // 阻止滚动
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (isStart) {
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
            onSign();
        };

        return (
            <div className="relative mt-2">
                <canvas 
                    ref={canvasRef}
                    onMouseDown={start} onMouseUp={end} onMouseLeave={end} onMouseMove={draw}
                    onTouchStart={start} onTouchEnd={end} onTouchCancel={end} onTouchMove={draw}
                    className="w-full h-20 bg-white/5 border border-white/20 rounded-2xl touch-none cursor-crosshair"
                />
                <div className="absolute top-3 left-3 text-[10px] text-white/30 pointer-events-none flex items-center gap-1.5"><Sparkles className="w-3 h-3"/> 请在此处手写签名</div>
                <button onClick={(e) => {
                    e.preventDefault();
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                    onClear();
                }} className="absolute bottom-3 right-3 text-[10px] bg-white/10 text-white/80 px-2.5 py-1.5 rounded-lg hover:bg-white/20 border border-white/10 transition-colors">重写</button>

                      </div>
                      <div className="w-full bg-indigo-100/50 h-1.5 rounded-full mt-3 overflow-hidden">
                        <div className="bg-indigo-500 h-full rounded-full transition-all" style={{width: `${(4/16)*100}%`}}></div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.02)] border border-slate-100 overflow-hidden p-5">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5"><Smile className="w-4 h-4 text-emerald-500" />情绪日历</h3>
                    <button onClick={() => setShowCalendarModal(true)} className="text-[10px] text-indigo-500 font-bold bg-indigo-50 px-2.5 py-1 rounded-full hover:bg-indigo-100 transition-colors flex items-center gap-0.5">查看全部 <ChevronRight className="w-3 h-3" /></button>
                  </div>
                  <div className="flex justify-between items-start">
                    {recentEmotions.map((item, idx) => (
                      <div key={idx} className={`flex flex-col items-center gap-1.5 ${item.isToday ? 'bg-indigo-50/50 p-2 -my-2 rounded-2xl border border-indigo-100/50 shadow-sm' : ''}`}>
                        <span className={`text-[10px] font-medium ${item.isToday ? 'text-indigo-600' : 'text-slate-400'}`}>{item.isToday ? '今日' : item.day}</span>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${item.emo ? '' : 'bg-slate-50 shadow-inner border border-slate-100'}`}>
                          {item.emo ? <span className={item.isToday ? 'scale-125 transition-transform' : ''}>{item.emo}</span> : <div className="w-1.5 h-1.5 bg-slate-200 rounded-full"></div>}
                        </div>
                        <span className={`text-[9px] font-bold ${item.emo ? 'text-slate-600' : 'text-slate-300'}`}>{item.label}</span>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.02)] border border-slate-100 overflow-hidden">
                  <button onClick={() => setShowFeedbackModal(true)} className="w-full flex items-center justify-between p-4 border-b border-slate-50 hover:bg-slate-50 transition-colors">
                     <div className="flex items-center gap-3.5"><div className="w-8 h-8 rounded-xl flex items-center justify-center bg-slate-50"><MessageSquare className="w-4 h-4 text-slate-500" /></div><span className="text-[13px] font-bold text-slate-700">意见反馈</span></div>
                     <ChevronRight className="w-4 h-4 text-slate-300" />
                  </button>
                  <button onClick={() => setShowAboutModal(true)} className="w-full flex items-center justify-between p-4 border-b border-slate-50 hover:bg-slate-50 transition-colors">
                     <div className="flex items-center gap-3.5"><div className="w-8 h-8 rounded-xl flex items-center justify-center bg-slate-50"><AlertCircle className="w-4 h-4 text-slate-500" /></div><span className="text-[13px] font-bold text-slate-700">关于应用</span></div>
                     <ChevronRight className="w-4 h-4 text-slate-300" />
                  </button>
                  <button onClick={() => setShowVersionModal(true)} className="w-full flex items-center justify-between p-4 border-b border-slate-50 hover:bg-slate-50 transition-colors">
                     <div className="flex items-center gap-3.5"><div className="w-8 h-8 rounded-xl flex items-center justify-center bg-slate-50"><Settings className="w-4 h-4 text-slate-500" /></div><span className="text-[13px] font-bold text-slate-700">版本信息</span></div>
                     <ChevronRight className="w-4 h-4 text-slate-300" />
                  </button>
                </div>
                
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="bg-[#e5e7eb] min-h-screen flex items-center justify-center p-4 font-sans selection:bg-indigo-100">
          <div className="w-[393px] h-[852px] bg-white rounded-[3.5rem] shadow-2xl relative flex flex-col border-[8px] border-zinc-900 ring-4 ring-zinc-800/20 box-content">
            
            <div className="w-full h-full bg-white rounded-[2.8rem] overflow-hidden relative">
              
              {/* 顶部手机状态栏 Mock */}
              <div className="h-12 w-full absolute top-0 z-50 flex justify-between items-center px-7 pointer-events-none">
                <span className="text-[13px] font-semibold text-slate-800 mix-blend-difference w-14">9:41</span>
                <div className="w-[120px] h-[32px] bg-black rounded-full flex justify-between items-center px-2"><div className="w-3 h-3 rounded-full bg-zinc-900 opacity-60 ml-2"></div></div>
                <div className="flex gap-1.5 items-center w-14 justify-end mix-blend-difference">
                  <div className="w-5 h-2.5 bg-transparent border border-slate-800 rounded-[3px] p-[1px] flex relative"><div className="bg-slate-800 w-full h-full rounded-[1px]"></div></div>
                </div>
              </div>

              {/* 主视图 */}
              {activeTab === 'home' && renderHomeView()}
              {activeTab === 'ai' && renderAIView()}
              {activeTab === 'health' && renderHealthView()}
              {activeTab === 'profile' && renderProfileView()}

              {/* 所有的模态框组件 (包含新增的 TaskDetailModal) */}
              {showEditProfile && <EditProfileModal userInfo={userInfo} onSave={setUserInfo} onClose={() => setShowEditProfile(false)} showToast={showToast} />}
              {authStep > 0 && <AuthModal authStep={authStep} setAuthStep={setAuthStep} userInfo={userInfo} onBindSuccess={(data) => { setUserInfo({...userInfo, ...data}); setAuthStep(0); }} showToast={showToast} />}
              {showLiveRoomModal && <LiveRoomModal onClose={() => setShowLiveRoomModal(false)} userInfo={userInfo} />}
              {activeHealthTask === 'multimodal' && <MultimodalAssessmentModal onClose={() => setActiveHealthTask(null)} userInfo={userInfo} confirmedEmotion={confirmedEmotion} />}
              {showCalendarModal && <CalendarModal onClose={() => setShowCalendarModal(false)} confirmedEmotion={confirmedEmotion} />}
              {showCheckInModal && <CheckInModal onClose={() => setShowCheckInModal(false)} checkInState={checkInState} setCheckInState={setCheckInState} checkInTime={checkInTime} setCheckInTime={setCheckInTime} checkOutTime={checkOutTime} setCheckOutTime={setCheckOutTime} showToast={showToast} userInfo={userInfo} />}
              {showAttendanceModal && <AttendanceHistoryModal onClose={() => setShowAttendanceModal(false)} checkInState={checkInState} checkInTime={checkInTime} checkOutTime={checkOutTime} />}
              {showCourseProgressModal && <CourseProgressModal onClose={() => setShowCourseProgressModal(false)} />}
              {showAssessmentHistoryModal && <AssessmentHistoryModal onClose={() => setShowAssessmentHistoryModal(false)} />}
              {showHistoryModal && <AIHistoryModal onClose={() => setShowHistoryModal(false)} onNewChat={() => {
                  setMessages([{ id: 1, role: 'ai', text: `你好 ${userInfo.name}！我是基于《2026秋季班：双脑与心理健康》教材构建的AI助教。有关课程知识点、作业疑惑，都可以向我提问哦。`, feedback: null }]);
                  setShowHistoryModal(false);
              }} />}
              {showTaskHistoryModal && <TaskHistoryModal onClose={() => setShowTaskHistoryModal(false)} />}
              {showFeedbackModal && <FeedbackModal onClose={() => setShowFeedbackModal(false)} showToast={showToast} />}
              {showAboutModal && <AboutModal onClose={() => setShowAboutModal(false)} />}
              {showVersionModal && <VersionModal onClose={() => setShowVersionModal(false)} />}
              
              {/* 作业详情渲染逻辑 */}
              {activeTaskDetail && <TaskDetailModal task={activeTaskDetail} onClose={() => setActiveTaskDetail(null)} showToast={showToast} />}
              
              {/* 音频播放器 */}
              {activeAudioInfo && <AudioPlayerModal audioInfo={activeAudioInfo} onClose={() => setActiveAudioInfo(null)} />}
              
              {/* 考勤打卡弹窗 */}
              {showCheckInModal && <CheckInModal onClose={() => setShowCheckInModal(false)} checkInState={checkInState} setCheckInState={setCheckInState} setCheckInTime={setCheckInTime} setCheckOutTime={setCheckOutTime} showToast={showToast} />}

              {/* 自定义情绪输入弹窗 */}
              {isInputtingCustomEmotion && (
                  <div className="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-end animate-in fade-in">
                    <div className="bg-white rounded-t-3xl p-6 shadow-2xl pb-10">
                       <h3 className="text-lg font-bold text-slate-800 mb-1">描述你的感觉</h3>
                       <p className="text-xs text-slate-500 mb-4">当前分类：{pendingCustomSlice?.coreData.name} &gt; {pendingCustomSlice?.subData.name}</p>
                       <textarea
                         className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 resize-none"
                         rows="3" placeholder="请描述你现在的感觉，AI将为你定制解析... (可不填，直接确认)" value={customEmotionText} onChange={e => setCustomEmotionText(e.target.value)}
                       ></textarea>
                       <div className="flex gap-3">
                         <button onClick={() => { setIsInputtingCustomEmotion(false); setCustomEmotionText(''); }} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-xl active:scale-95 transition-all text-sm border border-slate-200">取消</button>
                         <button onClick={() => {
                            const isCustomEmpty = !customEmotionText.trim();
                            setSelectedResult({ core: pendingCustomSlice.coreData, sub: pendingCustomSlice.subData, outer: isCustomEmpty ? null : { name: customEmotionText, en: 'Custom' }, path: pendingCustomSlice.pathId });
                            setIsInputtingCustomEmotion(false); setCustomEmotionText(''); setShowEmotionDetails(true); setTargetWheelRotation((450 - pendingCustomSlice.midAngle) % 360);
                         }} className="flex-1 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md shadow-indigo-500/30 active:scale-95 transition-all text-sm">
                            {customEmotionText.trim() ? "确认生成" : "直接确认"}
                         </button>
                       </div>
                    </div>
                  </div>
              )}

              {/* 情绪温度计弹窗 */}
              {showThermometerModal && (
                  <div className="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-end animate-in fade-in">
                    <div className="bg-white rounded-t-3xl p-6 shadow-2xl pb-10">
                       <h3 className="text-lg font-bold text-slate-800 mb-1 flex items-center gap-2"><Thermometer className="w-5 h-5 text-indigo-500" />情绪温度计</h3>
                       <p className="text-[13px] text-slate-500 mb-6 mt-1">请评估您当前这种感觉的强烈程度 (0-5分)</p>
                       <div className="mb-8 relative">
                         <div className="flex justify-between mb-2">
                            {[0, 1, 2, 3, 4, 5].map(val => (
                               <div key={val} onClick={() => setTempIntensity(val)} className={`flex flex-col items-center justify-center w-11 h-11 rounded-full cursor-pointer transition-all duration-300 ${tempIntensity === val ? 'bg-indigo-600 text-white shadow-xl scale-110 ring-4 ring-indigo-100' : 'bg-slate-50 text-slate-500 border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600'}`}>
                                 <span className="font-extrabold text-base">{val}</span>
                               </div>
                            ))}
                         </div>
                         <div className="bg-indigo-50/70 border border-indigo-100 p-3.5 rounded-2xl mt-5 flex items-center justify-center gap-2 transition-all animate-in zoom-in-95">
                            <Activity className="w-4 h-4 text-indigo-600" />
                            <p className="text-sm font-bold text-indigo-800">当前程度：{getIntensityFullLabel(tempIntensity)}</p>
                         </div>
                       </div>
                       <div className="flex gap-3">
                         <button onClick={() => setShowThermometerModal(false)} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-xl active:scale-95 transition-all text-sm border border-slate-200">取消评估</button>
                         <button onClick={() => {
                            setConfirmedEmotion({ ...selectedResult, intensity: tempIntensity, intensityLabel: getIntensityShortLabel(tempIntensity) });
                            setShowThermometerModal(false); setShowEmotionDetails(false); showToast("打卡成功");
                         }} className="flex-[2] py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 active:scale-95 transition-all text-sm flex items-center justify-center gap-1.5"><CheckCircle2 className="w-4 h-4" /> 确认提交完成</button>
                       </div>
                    </div>
                  </div>
              )}

              {/* 全局 Toast 提示框 */}
              {globalToast && (
                <div className="absolute top-16 left-1/2 -translate-x-1/2 z-[100] animate-in fade-in slide-in-from-top-4 duration-200">
                  <div className="bg-slate-800/90 backdrop-blur-md text-white text-[13px] font-bold px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 border border-slate-700">
                    <AlertCircle className="w-4 h-4 text-emerald-400" /> {globalToast}
                  </div>
                </div>
              )}

              {/* 底部主导航栏 */}
              <nav className="absolute bottom-6 left-5 right-5 z-40">
                <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl p-2 flex justify-between items-center shadow-[0_20px_40px_rgba(0,0,0,0.2)] border border-slate-700/50">
                  {[
                    { id: 'home', label: '主页', icon: Home },
                    { id: 'ai', label: 'AI助教', icon: Brain },
                    { id: 'health', label: 'AI健康', icon: HeartPulse },
                    { id: 'profile', label: '我的', icon: User },
                  ].map((tab) => {
                    const isActive = activeTab === tab.id;
                    return (
                      <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`relative flex items-center justify-center py-2.5 px-4 rounded-2xl transition-all duration-300 ${isActive ? 'bg-indigo-500/20 text-indigo-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'}`}>
                        <tab.icon className={`w-5 h-5 transition-transform duration-300 ${isActive ? 'scale-110 fill-indigo-500/20' : ''}`} />
                        {isActive && <span className="ml-2 text-[11px] font-bold animate-in fade-in slide-in-from-left-2 duration-300">{tab.label}</span>}
                      </button>
                    )
                  })}
                </div>
                <div className="w-[134px] h-[5px] bg-slate-800 rounded-full mx-auto mt-4"></div>
              </nav>
            </div>
          </div>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<StudentApp />);
  </script>
</body>
</html>
