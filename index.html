    const polarToCartesian = (centerX, centerY, radius, angleInDegrees) => {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return { x: centerX + (radius * Math.cos(angleInRadians)), y: centerY + (radius * Math.sin(angleInRadians)) };
    };

    const describeArc = (x, y, innerRadius, outerRadius, startAngle, endAngle) => {
      const startOuter = polarToCartesian(x, y, outerRadius, endAngle);
      const endOuter = polarToCartesian(x, y, outerRadius, startAngle);
      const startInner = polarToCartesian(x, y, innerRadius, endAngle);
      const endInner = polarToCartesian(x, y, innerRadius, startAngle);
      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
      return ["M", startOuter.x, startOuter.y, "A", outerRadius, outerRadius, 0, largeArcFlag, 0, endOuter.x, endOuter.y, "L", endInner.x, endInner.y, "A", innerRadius, innerRadius, 0, largeArcFlag, 1, startInner.x, startInner.y, "Z"].join(" ");
    };

    function useSmoothRotation(target) {
      const currentRef = useRef(target);
      const [, setTick] = useState(0);
      useEffect(() => {
        let raf;
        const loop = () => {
          let diff = (target - currentRef.current) % 360;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          if (Math.abs(diff) < 0.1) { currentRef.current = target; setTick(t => t + 1); return; }
          currentRef.current += diff * 0.12; 
          setTick(t => t + 1);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, [target]);
      return currentRef.current;
    }

    const getIntensityFullLabel = (val) => {
      if (val === 0) return '整体平静没有特殊';
      if (val <= 2) return '正常';
      if (val === 3) return '临界';
      return '强烈';
    };
    
    const getIntensityShortLabel = (val) => {

      if (val === 3) return '临界';

    };

    const generateMockEmotion = (year, month, day) => {
       const today = new Date(); today.setHours(0,0,0,0);
       const checkDate = new Date(year, month, day);
       if (checkDate > today) return null; 
       const seed = year * 10000 + (month+1) * 100 + day;
       const random = Math.abs(Math.sin(seed));
       if (random > 0.4) return null; 
       const emojis = ['😊', '😌', '😢', '😡', '😨', '🤢', '🤩'];
       const labels = ['快乐', '平静', '悲伤', '愤怒', '恐惧', '厌恶', '兴奋'];
       const index = Math.floor((random * 10) % emojis.length);
       return { emo: emojis[index], label: labels[index] };
    };

          setMessages(prev => [...prev, { id: Date.now(), role: 'user', text: finalQ }]);

            const timer = setInterval(() => {
              setMessages(prev => prev.map(m => m.id === aiMsgId ? { ...m, text: fullAnswer.substring(0, charIndex + 1) } : m));
              charIndex++;
              if (charIndex >= fullAnswer.length) {
                clearInterval(timer);

                      <g transform={`rotate(${currentRotation}, 400, 400)`}>
                        {slices.map((slice) => {
                          const pathData = describeArc(400, 400, slice.inner, slice.outer, slice.start, slice.end);
                          const isHL = !selectedResult || selectedResult.path.includes(slice.pathId) || slice.pathId.includes(selectedResult.path);
                          const rText = slice.inner + (slice.outer - slice.inner) / 2;
                          const pos = polarToCartesian(400, 400, rText, slice.midAngle);
                          let globalMidAngle = (slice.midAngle + currentRotation) % 360;
                          if (globalMidAngle < 0) globalMidAngle += 360;
                          const isLeftHalf = globalMidAngle > 180 && globalMidAngle < 360;
                          const textRotation = isLeftHalf ? slice.midAngle + 90 : slice.midAngle - 90;

                          return (
                            <g key={slice.pathId} className="cursor-pointer transition-opacity duration-300" style={{ opacity: isHL ? 1 : 0.15 }} onClick={() => handleSliceClick(slice)}>

              {showTaskHistoryModal && <TaskHistoryModal onClose={() => setShowTaskHistoryModal(false)} />}
              {showAboutModal && <AboutModal onClose={() => setShowAboutModal(false)} />}
              {showVersionModal && <VersionModal onClose={() => setShowVersionModal(false)} />}

              {/* 自定义情绪输入弹窗 */}
              {isInputtingCustomEmotion && (
                  <div className="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-end animate-in fade-in">
                    <div className="bg-white rounded-t-3xl p-6 shadow-2xl pb-10">
                       <h3 className="text-lg font-bold text-slate-800 mb-1">描述你的感觉</h3>
                       <p className="text-xs text-slate-500 mb-4">当前分类：{pendingCustomSlice?.coreData.name} &gt; {pendingCustomSlice?.subData.name}</p>
                       <textarea
                         className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 resize-none"
                         rows="3" placeholder="请描述你现在的感觉，AI将为你定制解析... (可不填，直接确认)" value={customEmotionText} onChange={e => setCustomEmotionText(e.target.value)}
                       ></textarea>
                       <div className="flex gap-3">
                         <button onClick={() => { setIsInputtingCustomEmotion(false); setCustomEmotionText(''); }} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-xl active:scale-95 transition-all text-sm border border-slate-200">取消</button>
                         <button onClick={() => {
                            const isCustomEmpty = !customEmotionText.trim();
                            setSelectedResult({ core: pendingCustomSlice.coreData, sub: pendingCustomSlice.subData, outer: isCustomEmpty ? null : { name: customEmotionText, en: 'Custom' }, path: pendingCustomSlice.pathId });
                            setIsInputtingCustomEmotion(false); setCustomEmotionText(''); setShowEmotionDetails(true); setTargetWheelRotation((450 - pendingCustomSlice.midAngle) % 360);
                         }} className="flex-1 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md shadow-indigo-500/30 active:scale-95 transition-all text-sm">
                            {customEmotionText.trim() ? "确认生成" : "直接确认"}
                         </button>
                       </div>
                    </div>
                  </div>
              )}

              {/* 情绪温度计弹窗 */}
              {showThermometerModal && (
                  <div className="absolute inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-end animate-in fade-in">
                    <div className="bg-white rounded-t-3xl p-6 shadow-2xl pb-10">
                       <h3 className="text-lg font-bold text-slate-800 mb-1 flex items-center gap-2"><Thermometer className="w-5 h-5 text-indigo-500" />情绪温度计</h3>
                       <p className="text-[13px] text-slate-500 mb-6 mt-1">请评估您当前这种感觉的强烈程度 (0-5分)</p>
                       <div className="mb-8 relative">
                         <div className="flex justify-between mb-2">
                            {[0, 1, 2, 3, 4, 5].map(val => (
                               <div key={val} onClick={() => setTempIntensity(val)} className={`flex flex-col items-center justify-center w-11 h-11 rounded-full cursor-pointer transition-all duration-300 ${tempIntensity === val ? 'bg-indigo-600 text-white shadow-xl scale-110 ring-4 ring-indigo-100' : 'bg-slate-50 text-slate-500 border border-slate-200 hover:bg-indigo-50 hover:text-indigo-600'}`}>
                                 <span className="font-extrabold text-base">{val}</span>
                               </div>
                            ))}
                         </div>
                         <div className="bg-indigo-50/70 border border-indigo-100 p-3.5 rounded-2xl mt-5 flex items-center justify-center gap-2 transition-all animate-in zoom-in-95">
                            <Activity className="w-4 h-4 text-indigo-600" />
                            <p className="text-sm font-bold text-indigo-800">当前程度：{getIntensityFullLabel(tempIntensity)}</p>
                         </div>
                       </div>
                       <div className="flex gap-3">
                         <button onClick={() => setShowThermometerModal(false)} className="flex-1 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-xl active:scale-95 transition-all text-sm border border-slate-200">取消评估</button>
                         <button onClick={() => {
                            setConfirmedEmotion({ ...selectedResult, intensity: tempIntensity, intensityLabel: getIntensityShortLabel(tempIntensity) });
                            setShowThermometerModal(false); setShowEmotionDetails(false); showToast("打卡成功");
                         }} className="flex-[2] py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 active:scale-95 transition-all text-sm flex items-center justify-center gap-1.5"><CheckCircle2 className="w-4 h-4" /> 确认提交完成</button>
                       </div>
                    </div>
                  </div>
              )}

              {/* 考勤签到弹窗 */}
              {showCheckInModal && (
                  <div className="absolute inset-0 z-50 bg-[#f8fafc] flex flex-col animate-in slide-in-from-bottom-full duration-300">
                    <div className="pt-14 pb-4 px-5 flex items-center justify-between shrink-0 relative z-20">
                      <div className="flex items-center gap-4">
                        <button onClick={() => setShowCheckInModal(false)} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-200 transition-colors">
                          <ArrowLeft className="w-6 h-6" />
                        </button>
                        <h2 className="text-[17px] font-extrabold text-slate-800 tracking-wide">课程考勤</h2>
                      </div>
                      <button onClick={() => setIsLocationInRange(!isLocationInRange)} className="text-[11px] font-bold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-lg active:scale-95">模拟定位</button>
                    </div>

                    <div className="flex-1 flex flex-col items-center pt-6 pb-10 relative overflow-y-auto no-scrollbar px-5">
                      <div className="flex flex-col items-center z-10 animate-in fade-in slide-in-from-top-4 mb-6">
                        <div className="relative">
                          <img src={userInfo.avatar} alt="头像" className="w-[72px] h-[72px] rounded-full border-4 border-white shadow-sm object-cover mb-3" />
                        </div>
                        <h3 className="text-xl font-black text-slate-800 tracking-tight">{userInfo.name}</h3>
                        <div className="mt-2.5 text-[11px] font-bold text-slate-500 bg-white px-3.5 py-1.5 rounded-full shadow-sm border border-slate-100">
                          {userInfo.studentId} · {userInfo.major}
                        </div>
                      </div>

                      <div className="relative flex items-center justify-center w-full h-[280px] z-10 my-4">
                        {checkInState === 0 && isLocationInRange && (
                          <>
                            <div className="absolute w-72 h-72 bg-indigo-500/10 rounded-full animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
                            <div className="absolute w-60 h-60 bg-indigo-500/20 rounded-full animate-[ping_2s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
                            <div className="absolute w-[200px] h-[200px] bg-indigo-200/50 rounded-full"></div>
                          </>
                        )}
                        <button
                          disabled={!isLocationInRange || checkInState === 2}
                          onClick={() => {
                            const now = new Date(); const tStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                            if (checkInState === 0) { setCheckInState(1); setCheckInTime(tStr); showToast("签到成功"); } else { setCheckInState(2); setCheckOutTime(tStr); showToast("签退成功，考勤归档"); }
                          }}
                          className={`relative z-20 w-[170px] h-[170px] rounded-full flex flex-col items-center justify-center text-white shadow-[0_10px_40px_rgba(79,70,229,0.3)] transition-all duration-500 ${
                            !isLocationInRange ? 'bg-slate-300 shadow-none cursor-not-allowed' : checkInState === 2 ? 'bg-emerald-500 shadow-[0_10px_40px_rgba(16,185,129,0.3)]' : checkInState === 1 ? 'bg-orange-500 shadow-[0_10px_40px_rgba(249,115,22,0.3)] active:scale-95' : 'bg-gradient-to-b from-[#5b6efc] to-[#4338ca] active:scale-95'
                          }`}
                        >
                          <div className="flex flex-col items-center justify-center">
                            {checkInState === 2 ? <CheckCircle2 className="w-8 h-8 mb-1" /> : <ScanLine className="w-6 h-6 mb-2 opacity-90" />}
                            <span className="text-[32px] font-black tracking-[0.15em] ml-2 drop-shadow-sm leading-none">{checkInState === 0 ? '签 到' : checkInState === 1 ? '签 退' : '已完成'}</span>
                            <span className="text-[10px] font-bold opacity-90 mt-2.5 tracking-widest">{checkInState === 0 ? '课程开始打卡' : checkInState === 1 ? '课程结束打卡' : '今日考勤已归档'}</span>
                          </div>
                        </button>
                      </div>
                      
                      <div className="w-full flex flex-col gap-4 z-10 mt-auto">
                        {/* 签到签退时间卡片 */}
                        <div className="bg-white rounded-[1.5rem] p-6 shadow-[0_4px_20px_rgb(0,0,0,0.03)] flex justify-between relative">
                          <div className="flex flex-col items-center flex-1">
                            <span className="text-[11px] text-slate-400 font-bold mb-2 tracking-widest">签到时间</span>
                            <span className={`text-[22px] font-black font-mono ${checkInTime ? 'text-slate-700' : 'text-slate-300'}`}>{checkInTime ? `${checkInTime}` : '-- : --'}</span>
                          </div>
                          <div className="w-[1px] bg-slate-100 absolute left-1/2 top-6 bottom-6 -translate-x-1/2"></div>
                          <div className="flex flex-col items-center flex-1">
                            <span className="text-[11px] text-slate-400 font-bold mb-2 tracking-widest">签退时间</span>
                            <span className={`text-[22px] font-black font-mono ${checkOutTime ? 'text-slate-700' : 'text-slate-300'}`}>{checkOutTime ? `${checkOutTime}` : '-- : --'}</span>
                          </div>
                        </div>

                        {/* 打卡范围状态卡片 */}
                        {checkInState !== 2 && (
                          <div className={`bg-white rounded-[1.5rem] p-4 shadow-[0_4px_20px_rgb(0,0,0,0.03)] border-2 transition-colors ${isLocationInRange ? 'border-emerald-50' : 'border-rose-50'}`}>
                            <div className="flex items-center gap-3.5">
                              <div className={`w-11 h-11 rounded-full flex items-center justify-center shrink-0 ${isLocationInRange ? 'bg-emerald-50 text-emerald-500' : 'bg-rose-50 text-rose-500'}`}>
                                <MapPin className="w-5 h-5" />
                              </div>
                              <div className="flex-1">
                                <p className="text-[10px] text-slate-400 font-bold tracking-widest mb-1">当前打卡范围要求</p>
                                <p className="text-[13px] font-extrabold text-slate-800 tracking-tight">紫金港校区 东1B-211</p>
                              </div>
                              <div className="shrink-0">
                                {isLocationInRange ? (
                                    <span className="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100/50">在范围内</span>
                                ) : (
                                    <span className="text-[11px] font-bold text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-100/50">未在范围</span>
                                )}
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
              )}

              {/* 意见反馈弹窗 */}
              {showFeedbackModal && (
                  <div className="absolute inset-0 z-50 bg-white flex flex-col animate-in slide-in-from-bottom-full duration-300">
                    <div className="pt-14 pb-4 px-5 flex items-center gap-4 border-b border-slate-100 shrink-0">
                      <button onClick={() => setShowFeedbackModal(false)} className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200">
                        <ArrowLeft className="w-5 h-5" />
                      </button>
                      <h2 className="text-lg font-bold text-slate-800">意见反馈</h2>
                    </div>
                    <div className="flex-1 overflow-y-auto p-5 bg-slate-50/50">
                      <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm mb-4">
                        <h3 className="text-sm font-bold text-slate-800 mb-3">问题类型</h3>
                        <div className="flex flex-wrap gap-2">
                          {['功能异常', '产品建议', '教学建议', '课程难度', '其他'].map(type => (
                            <button key={type} className="px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-full text-xs font-medium text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition-colors">{type}</button>
                          ))}
                        </div>
                      </div>
                      <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <h3 className="text-sm font-bold text-slate-800 mb-3">问题描述</h3>
                        <textarea className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[120px] resize-none" placeholder="请详细描述您遇到的问题或建议..."></textarea>
                        <div className="mt-4 flex justify-end">
                          <button onClick={() => { setShowFeedbackModal(false); showToast("反馈提交成功"); }} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-md active:scale-95 transition-transform">提交反馈</button>
                        </div>
                      </div>
                    </div>
                  </div>
              )}

              {/* 全局 Toast 提示框 */}
              {globalToast && (
                <div className="absolute top-16 left-1/2 -translate-x-1/2 z-[100] animate-in fade-in slide-in-from-top-4 duration-200">
                  <div className="bg-slate-800/90 backdrop-blur-md text-white text-[13px] font-bold px-5 py-2.5 rounded-full shadow-xl flex items-center gap-2 border border-slate-700">
                    <AlertCircle className="w-4 h-4 text-emerald-400" /> {globalToast}
                  </div>
                </div>
              )}

              {/* 底部主导航栏 */}
              <nav className="absolute bottom-6 left-5 right-5 z-40">
                <div className="bg-slate-900/90 backdrop-blur-2xl rounded-3xl p-2 flex justify-between items-center shadow-[0_20px_40px_rgba(0,0,0,0.2)] border border-slate-700/50">
                  {[
                    { id: 'home', label: '主页', icon: Home },
                    { id: 'ai', label: 'AI助教', icon: Brain },
                    { id: 'health', label: 'AI健康', icon: HeartPulse },
                    { id: 'profile', label: '我的', icon: User },
                  ].map((tab) => {
                    const isActive = activeTab === tab.id;
                    return (
                      <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`relative flex items-center justify-center py-2.5 px-4 rounded-2xl transition-all duration-300 ${isActive ? 'bg-indigo-500/20 text-indigo-400' : 'text-slate-400 hover:text-slate-200 hover:bg-white/5'}`}>
                        <tab.icon className={`w-5 h-5 transition-transform duration-300 ${isActive ? 'scale-110 fill-indigo-500/20' : ''}`} />
                        {isActive && <span className="ml-2 text-[11px] font-bold animate-in fade-in slide-in-from-left-2 duration-300">{tab.label}</span>}
                      </button>
                    )
                  })}
                </div>
                <div className="w-[134px] h-[5px] bg-slate-800 rounded-full mx-auto mt-4"></div>
              </nav>
            </div>
          </div>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<StudentApp />);
  </script>
</body>
</html>
